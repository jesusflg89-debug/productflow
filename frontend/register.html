<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Crear cuenta | ProductFlow</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>


<body class="pagina-login">

  <main class="login-container">

    <section class="login-card">


      <!-- =====================================
           ENCABEZADO
      ====================================== -->

      <div class="login-header">

        <div
          class="logo"
          aria-hidden="true"
        >
          PF
        </div>

        <h1>
          ProductFlow
        </h1>

        <p>
          Crea tu cuenta para gestionar productos
        </p>

      </div>


      <!-- =====================================
           FORMULARIO DE REGISTRO
      ====================================== -->

      <form id="register-form">

        <h2>
          Crear cuenta
        </h2>


        <!-- Nombre -->

        <div class="form-group">

          <label for="name">
            Nombre
          </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Ingresa tu nombre"
            autocomplete="name"
            minlength="2"
            maxlength="80"
            required
          >

        </div>


        <!-- Correo electrónico -->

        <div class="form-group">

          <label for="email">
            Correo electrónico
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="ejemplo@correo.com"
            autocomplete="email"
            required
          >

        </div>


        <!-- Contraseña -->

        <div class="form-group">

          <label for="password">
            Contraseña
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Mínimo 6 caracteres"
            autocomplete="new-password"
            minlength="6"
            required
          >

        </div>


        <!-- Confirmar contraseña -->

        <div class="form-group">

          <label for="confirm-password">
            Confirmar contraseña
          </label>

          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Repite tu contraseña"
            autocomplete="new-password"
            minlength="6"
            required
          >

        </div>


        <!-- Mensajes -->

        <p
          id="mensaje-registro"
          class="mensaje"
          role="alert"
          aria-live="polite"
        ></p>


        <!-- Botón -->

        <button
          type="submit"
          class="btn-primary"
        >
          Crear cuenta
        </button>

      </form>


      <!-- =====================================
           PIE
      ====================================== -->

      <div class="login-footer">

        <p>
          ¿Ya tienes una cuenta?

          <a href="login.html">
            Iniciar sesión
          </a>
        </p>

      </div>


    </section>

  </main>


  <!-- JavaScript -->

  <script src="app.js"></script>

</body>

</html>
